<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四個梯形，一個面積</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#243445;background:#f5f3ee}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;margin:0 0 8px}p{margin:0;line-height:1.7}.muted{color:#677582}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:20px}.stage{background:#fff;border:1px solid #e0e4e4;border-radius:18px;overflow:hidden}svg{width:100%;height:min(65vh,620px);display:block}aside{padding:26px 24px;background:#eaf0ee;border-radius:18px}h2{font-size:24px;margin:16px 0}.count{font-size:13px;letter-spacing:2px;color:#526e65}.formula{font-size:25px;line-height:1.8;margin-top:25px;font-weight:600;min-height:125px}.note{margin-top:18px;font-size:15px;color:#52665f}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer;border:1px solid #cbd5d1;border-radius:9px;padding:10px 17px;background:#fff;color:#243445}button.primary{background:#246455;color:#fff;border-color:#246455}button:disabled{opacity:.4;cursor:default}input[type=range]{accent-color:#246455;flex:1;min-width:160px}.steps{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.steps button{padding:6px 11px;font-size:14px}.steps button.active{background:#d8e9e0;border-color:#246455}footer{font-size:13px;color:#75827c;margin-top:15px}svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:white;stroke-width:.06;stroke-linejoin:round;fill:#253c46}svg polygon,svg path,svg line{vector-effect:non-scaling-stroke}#overlays{pointer-events:none}@media(max-width:850px){main{padding:16px}.layout{grid-template-columns:1fr}aside{padding:18px}.formula{min-height:0;margin-top:8px}svg{height:52vh}h1{font-size:25px}header{align-items:flex-start}}
</style><main><header><div><h1>四個梯形，一個面積</h1><p class="muted">直角梯形 ABCD，AD ∥ BC，AB ⟂ AD<br>BC = b，AB = AD = a，CD = 2a。求梯形面積。</p></div><button id="full">全螢幕</button></header><div class="layout"><div class="stage"><svg id="svg" viewBox="-4 -3.8 8 7.6" role="img" aria-label="四個全等直角梯形旋轉拼接的面積證明"><g id="pieces"></g><g id="overlays"></g></svg></div><aside aria-live="polite"><div class="count" id="count"></div><h2 id="title"></h2><p id="desc"></p><div class="formula" id="formula"></div><p class="note" id="note"></p></aside></div><div class="controls"><button id="prev">← 上一步</button><button id="next" class="primary">下一步 →</button><button id="play">自動播放</button><input id="progress" type="range" min="0" max="6" step="0.01" value="0" aria-label="動畫進度"><button id="reset">重來</button></div><nav class="steps" id="steps" aria-label="展示步驟"></nav><footer>← → 切換步驟 · 空白鍵播放／暫停 · 拖曳進度條可停在移動途中 · 單檔離線使用</footer></main><script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg',r=Math.sqrt(3),a=1,b=1+r;
// D=(0,0), C=(0,2), A=(-1/2,-sqrt(3)/2), B=A+(-sqrt(3)/2,1/2).
// Translate the central square's center to the origin. All four copies are rigid rotations.
const raw=[[-.5-1,-r/2-1],[-.5-r/2-1,.5-r/2-1],[-1,1],[-1,-1]],E=[-r/2-1,-.5];
const center=raw.reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4],[0,0]);
const poly=raw.map(p=>[p[0]-center[0],p[1]-center[1]]),spots=[[-2,-1.65],[2,-1.65],[2,1.65],[-2,1.65]];
const colors=['#91c3b1','#aac7e2','#e8bf80','#c3b3d9'];
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
const points=p=>p.map(x=>x.join(',')).join(' '),rot=(p,t)=>[p[0]*Math.cos(t)-p[1]*Math.sin(t),p[0]*Math.sin(t)+p[1]*Math.cos(t)];
function label(parent,p,text,size=.24,color){const e=el('text',{x:p[0],y:p[1],'font-size':size,'text-anchor':'middle','dominant-baseline':'middle'},parent);e.textContent=text;if(color)e.style.fill=color;return e}
const groups=[],labels=[];
for(let i=0;i<4;i++){const g=el('g',{},$('pieces'));groups.push(g);el('polygon',{points:points(poly),fill:colors[i],stroke:'#365c60','stroke-width':2},g);const lg=el('g',{},g);labels.push(lg);const names=['A','B','C','D'];poly.forEach((p,j)=>{const len=Math.hypot(...p);label(lg,[p[0]+.19*p[0]/len,p[1]+.19*p[1]/len],names[j],.23)});[[0,1,'a',-.16,-.15],[3,0,'a',.19,-.02],[1,2,'b',-.2,.04],[2,3,'2a',.24,0]].forEach(([j,k,t,dx,dy])=>label(lg,[(poly[j][0]+poly[k][0])/2+dx,(poly[j][1]+poly[k][1])/2+dy],t));const A=poly[0],u=[-.8660254,.5],v=[.5,.8660254],q=.17;el('path',{d:`M ${A[0]+q*u[0]} ${A[1]+q*u[1]} l ${q*v[0]} ${q*v[1]} l ${-q*u[0]} ${-q*u[1]}`,fill:'none',stroke:'#365c60','stroke-width':1.4},lg)}
const data=[['觀察一個梯形','已知兩條相鄰的邊都是 a，另一腰長 2a。先想一想：如何利用四個相同的圖形？','S = ?','先不公布答案，讓學生提出拼法。'],['複製成四個','四個梯形完全相同；接下來只做旋轉與平移。','總面積 = 4S','四份副本都保持原來的大小與形狀。'],['旋轉、接起來','讓四條長 2a 的腰圍成中央的正方形洞。','總面積 = 4S','可拖曳進度條，慢慢觀察每一塊如何移動。'],['找出大正方形','沿著四條 BC 所在的直線看：大正方形的每一邊長都是 b。','大正方形：b²','虛線將突出的小正方形與內側三角形分開。'],['加上四個小正方形','每一個突出部分都是邊長 a 的正方形。中央仍有一個正方形洞。','b² + 4a²','這裡先把中央的洞一併算入。'],['扣掉中央的洞','中央正方形的邊長是 CD = 2a。要扣掉多少面積？','4S = b² + 4a² − (2a)²','先問學生：四個小正方形的總面積，與洞的面積有什麼關係？'],['面積抵消了','四個小正方形恰好補回中央洞的面積。','4S = b²<br><span style="color:#246455;font-size:34px">S = b² / 4</span>','若 b = 6，則梯形面積為 9。']];
let value=0,raf=0,playing=false,lastStep=-1;
function overlay(step){const root=$('overlays');root.replaceChildren();if(step<2)return;
for(let i=0;i<4;i++){const g=el('g',{transform:`rotate(${i*90})`},root);el('line',{x1:-1,y1:-1,x2:E[0],y2:E[1],stroke:'#486c67','stroke-width':1.7,'stroke-dasharray':'6 5',opacity:step>=3?1:0},g)}
if(step>=3){const big=Array.from({length:4},(_,i)=>rot(E,i*Math.PI/2));el('polygon',{points:points(big),fill:'#e7b84a','fill-opacity':step===3?.23:.08,stroke:'#a57b1c','stroke-width':3},root);for(let i=0;i<4;i++){const p=big[i],q=big[(i+1)%4];label(root,[(p[0]+q[0])/2,(p[1]+q[1])/2],'b',.26,'#916514')}}
if(step>=4){for(let i=0;i<4;i++){const sq=[raw[3],raw[0],raw[1],E].map(p=>rot(p,i*Math.PI/2));el('polygon',{points:points(sq),fill:'#4f9b80','fill-opacity':.25,stroke:'#246455','stroke-width':2},root);const c=sq.reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4],[0,0]);label(root,c,'a²',.29,'#246455')}}
if(step>=5){el('polygon',{points:'-1,-1 1,-1 1,1 -1,1',fill:'#f9e3df',stroke:'#b65e54','stroke-width':2.5,'stroke-dasharray':'7 5'},root);label(root,[0,-.22],'扣掉洞',.22,'#a14840');label(root,[0,.22],step===6?'4a²':'(2a)²',.36,'#a14840');label(root,[0,1.2],'2a',.22);label(root,[-1.23,0],'2a',.22)}else label(root,[0,0],'正方形洞',.23)}
function draw(v){value=v;$('progress').value=v;const step=Math.min(6,Math.floor(v+1e-7));const t=Math.max(0,Math.min(1,v-1)),s=t*t*(3-2*t);groups.forEach((g,i)=>{let angle=-60+(i*90+60)*s;const target=rot(center,i*Math.PI/2);let xy;if(v<=1){const z=v*v*(3-2*v);xy=[spots[i][0]*z,spots[i][1]*z];angle=-60}else xy=[spots[i][0]*(1-s)+target[0]*s,spots[i][1]*(1-s)+target[1]*s];g.setAttribute('transform',`translate(${xy}) rotate(${angle})`);labels[i].querySelectorAll('text').forEach(e=>e.setAttribute('transform',`rotate(${-angle} ${e.getAttribute('x')} ${e.getAttribute('y')})`));g.setAttribute('opacity',i===0?1:Math.min(1,v));labels[i].setAttribute('opacity',v<1?1-v:0)});if(step!==lastStep){lastStep=step;$('count').textContent=`STEP 0${step+1} / 07`;['title','desc','formula','note'].forEach((id,i)=>$(id).innerHTML=data[step][i]);overlay(step);[...$('steps').children].forEach((e,i)=>e.classList.toggle('active',i===step))}$('prev').disabled=v===0;$('next').disabled=v===6}
function stop(){cancelAnimationFrame(raf);playing=false;$('play').textContent='自動播放'}
function go(target){stop();const start=value,time=performance.now(),duration=1100;function tick(now){const p=Math.min(1,(now-time)/duration);draw(start+(target-start)*p);if(p<1)raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
$('next').onclick=()=>go(Math.min(6,Math.floor(value+.001)+1));$('prev').onclick=()=>go(Math.max(0,Math.ceil(value-.001)-1));$('reset').onclick=()=>{stop();draw(0)};$('progress').oninput=e=>{stop();draw(+e.target.value)};
$('play').onclick=()=>{if(playing){stop();return}if(value>=6)draw(0);playing=true;$('play').textContent='暫停';let previous=performance.now();function tick(now){const delta=(now-previous)/1000;previous=now;draw(Math.min(6,value+delta/4));if(value<6)raf=requestAnimationFrame(tick);else stop()}raf=requestAnimationFrame(tick)};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{ $('full').textContent='請使用瀏覽器全螢幕'}};
data.forEach((d,i)=>{const e=document.createElement('button');e.textContent=`${i+1} ${['題目','複製','拼接','大正方形','小正方形','扣洞','揭曉'][i]}`;e.onclick=()=>go(i);$('steps').appendChild(e)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){e.preventDefault();$('next').click()}if(e.key==='ArrowLeft'){e.preventDefault();$('prev').click()}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('play').click()}});draw(0);
</script></html>
